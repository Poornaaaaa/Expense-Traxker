
<!DOCTYPE html>
<html>
<head>
<title>Expense Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
<h2 class="text-center mb-4">💰 Expense Tracker</h2>

<div class="row g-3 mb-4">
<div class="col-md-4"><div class="card p-3 text-center"><b>Balance</b><h3 id="balance">₹0</h3></div></div>
<div class="col-md-4"><div class="card p-3 text-center"><b>Income</b><h3 class="text-success" id="income">₹0</h3></div></div>
<div class="col-md-4"><div class="card p-3 text-center"><b>Expense</b><h3 class="text-danger" id="expense">₹0</h3></div></div>
</div>

<div class="card p-3 mb-3">
<div class="row g-2">
<div class="col-md-3"><input id="name" class="form-control" placeholder="Name"></div>
<div class="col-md-2"><input id="amount" type="number" class="form-control" placeholder="Amount"></div>
<div class="col-md-2"><select id="type" class="form-select"><option>Expense</option><option>Income</option></select></div>
<div class="col-md-2"><select id="category" class="form-select"><option>Food</option><option>Travel</option><option>Shopping</option><option>Education</option><option>Other</option></select></div>
<div class="col-md-3"><button onclick="add()" class="btn btn-primary">Add</button> <button onclick="clearAll()" class="btn btn-danger">Clear</button></div>
</div>
</div>

<input id="search" class="form-control mb-3" placeholder="🔍 Search" onkeyup="show()">

<table class="table table-bordered table-hover text-center bg-white">
<thead class="table-dark"><tr><th>Name</th><th>Amount</th><th>Type</th><th>Category</th><th>Action</th></tr></thead>
<tbody id="list"></tbody>
</table>
</div>

<script>
let data=JSON.parse(localStorage.getItem("transactions"))||[],edit=-1;

const $=id=>document.getElementById(id);

function add(){
let n=$("name").value.trim(),a=Number($("amount").value),t=$("type").value,c=$("category").value;
if(!n||a<=0)return alert("Enter valid details");
let x={n,a,t,c};
edit<0?data.push(x):data[edit]=x;
edit=-1;save();show();$("name").value=$("amount").value="";
}

function show(){
let i=0,e=0,s=$("search").value.toLowerCase(),html="";
data.forEach((x,k)=>{
x.t=="Income"?i+=x.a:e+=x.a;
if(x.n.toLowerCase().includes(s))
html+=`<tr><td>${x.n}</td><td>₹${x.a}</td><td>${x.t}</td><td>${x.c}</td><td>
<button class="btn btn-warning btn-sm" onclick="editData(${k})">Edit</button>
<button class="btn btn-danger btn-sm" onclick="del(${k})">Delete</button></td></tr>`;
});
$("list").innerHTML=html;
$("income").innerText="₹"+i;
$("expense").innerText="₹"+e;
$("balance").innerText="₹"+(i-e);
}

function editData(k){
let x=data[k];
$("name").value=x.n;$("amount").value=x.a;$("type").value=x.t;$("category").value=x.c;edit=k;
}

function del(k){
if(confirm("Delete transaction?")){data.splice(k,1);save();show();}
}

function clearAll(){
if(confirm("Clear all transactions?")){data=[];save();show();}
}

function save(){localStorage.setItem("transactions",JSON.stringify(data));}
show();
</script>
</body>
